name: Deploy mdBook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install mdBook
      - name: Install mdBook
        run: |
          MD_BOOK_VERSION=0.5.10
          curl -L https://github.com/rust-lang/mdBook/releases/download/v${MD_BOOK_VERSION}/mdbook-v${MD_BOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz \
          -o mdbook.tar.gz
          tar -xzf mdbook.tar.gz
          sudo mv mdbook /usr/local/bin/
          mdbook --version

      # Build the book from src/
      - name: Build book
        run: mdbook build

      # Deploy the built book/ folder to gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          publish_branch: gh-pages

name: Deploy mdBook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          MD_BOOK_VERSION=0.5.10
          curl -L -o mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v${MD_BOOK_VERSION}/mdbook-v${MD_BOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          mkdir mdbook_tmp
          tar -xzf mdbook.tar.gz -C mdbook_tmp
          sudo mv mdbook_tmp/mdbook /usr/local/bin/
          rm -rf mdbook_tmp mdbook.tar.gz
          mdbook --version

      - name: Build book
        run: mdbook build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          publish_branch: gh-pages

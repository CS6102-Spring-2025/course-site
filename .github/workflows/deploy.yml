name: Deploy mdBook

# Trigger workflow on push to main or manually
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install mdBook using GitHub Action
      - name: Install mdBook
        uses: rust-lang/mdBook@v0.5.10

      # Build from src/
      - name: Build book
        run: mdbook build

      # Deploy built book/ to gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          publish_branch: gh-pages
